plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
}

android {
    namespace 'com.sap.droidx'
    compileSdk 36

    defaultConfig {
        applicationId "com.sap.droidx"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true; compose true }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE',
                         'META-INF/license.txt', 'META-INF/notice.txt',
                         'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // AndroidX / Material
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    // Barcode / QR scanning
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'


    // Kotlin + coroutines
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Compose runtime (needed for getFlowCustomizationSteps / addSingleStep)
    implementation 'androidx.compose.runtime:runtime:1.7.6'
    implementation 'androidx.compose.animation:animation:1.7.6'
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    // ---- SAP BTP SDK for Android ----
    // Foundation (settings, logger, common infra)
    implementation "com.sap.cloud.android:foundation:$sap_sdk_version"
    // Flows V2 – pre-built onboarding / passcode / logon screens
    implementation "com.sap.cloud.android:flowsv2:$sap_sdk_version"
    implementation "com.sap.cloud.android:flows-compose:$sap_sdk_version"
    // Fix for bug in SDK 26.1.2 POM
    implementation "com.sap.cloud.android:fiori-composable-theme:$sap_sdk_version"
    // OData (consume CAP service exposed via Mobile Services destination)
    implementation "com.sap.cloud.android:odata:$sap_sdk_version"
    // Fiori UI widgets (optional – gives you the SAP-styled list cells)
    implementation "com.sap.cloud.android:fiori:$sap_sdk_version"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
