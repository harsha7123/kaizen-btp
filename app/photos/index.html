<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaizen Photos</title>
  <!-- ponytail: stop-gap viewer until the Phase 3 Fiori object page shows photos -->
  <link rel="stylesheet" href="../capture/theme.css">
  <style>
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 20px;
      background: color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: 1px solid var(--stroke); }
    header a { color: var(--primary); font-weight: 600; text-decoration: none; }
    header h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -.01em; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
    article { padding: 20px; }
    article h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: -.01em; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
    .meta b { color: var(--text); }
    .photos { display: flex; gap: 14px; flex-wrap: wrap; }
    figure { margin: 0; }
    figure img { width: 220px; height: 220px; object-fit: cover; border-radius: var(--r-md); display: block; background: var(--field); border: 1px solid var(--stroke); cursor: zoom-in; transition: transform .2s var(--ease); }
    figure img:hover { transform: scale(1.02); }
    figcaption { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 6px; }
    .none { color: var(--muted); }
    dialog { border: 0; padding: 0; background: transparent; max-width: 95vw; max-height: 95vh; }
    dialog img { max-width: 95vw; max-height: 95vh; display: block; border-radius: var(--r-lg); }
    dialog::backdrop { background: rgba(4, 17, 15, .8); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  </style>
</head>
<body>
  <header><a href="../">‹ Kaizen</a><h1>Photo gallery</h1><button id="reload" type="button" class="btn">Refresh</button></header>
  <main id="list"><p class="none">Loading…</p></main>
  <dialog id="big"><img alt=""></dialog>
  <script type="module">
    const API = '/odata/v4/kaizen'
    const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e }
    const big = document.getElementById('big')
    big.onclick = () => big.close()

    async function load () {
      const list = document.getElementById('list')
      const res = await fetch(`${API}/Kaizens?$select=ID,number,title,status_code,equipment_ID,plant_ID,createdBy,createdAt&$expand=photos($select=ID,kind,createdAt;$orderby=createdAt)&$orderby=number desc`)
      if (!res.ok) return list.replaceChildren(el('p', { className: 'none', textContent: `Could not load kaizens (HTTP ${res.status})` }))
      const kaizens = (await res.json()).value
      if (!kaizens.length) return list.replaceChildren(el('p', { className: 'none', textContent: 'No kaizens yet. Submit one from the capture app.' }))
      list.replaceChildren(...kaizens.map(k => {
        const meta = el('div', { className: 'meta' })
        meta.append('Machine ', el('b', { textContent: k.equipment_ID ?? '–' }), ' · Plant ', el('b', { textContent: k.plant_ID ?? '–' }),
          ' · Status ', el('b', { textContent: k.status_code }), ` · by ${k.createdBy} · ${new Date(k.createdAt).toLocaleString()}`)
        const photos = k.photos.length
          ? el('div', { className: 'photos' }, ...k.photos.map(p => {
              const src = `${API}/Photos(${p.ID})/content`
              const img = el('img', { src, alt: `${p.kind} photo of ${k.number}`, loading: 'lazy' })
              img.onclick = () => { big.querySelector('img').src = src; big.showModal() }
              return el('figure', {}, img, el('figcaption', { textContent: `${p.kind} · ${new Date(p.createdAt).toLocaleString()}` }))
            }))
          : el('p', { className: 'none', textContent: 'No photos' })
        return el('article', { className: 'glass' }, el('h2', { textContent: `${k.number} · ${k.title}` }), meta, photos)
      }))
    }
    document.getElementById('reload').onclick = load
    load()
  </script>
</body>
</html>
